{% set version = "0.8" %}

package:
  name: pandana
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/pandana/pandana-{{ version }}.tar.gz
  sha256: 1a179b0e4cffa8287a0724f67c2f666891bdeb203288bd68181ca86189e3014d

build:
  number: 0
  script:
    - export LDFLAGS="$LDFLAGS -fopenmp"  # [osx]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=0.25.2                        # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - llvm-openmp  # [osx]
  host:
    - python
    - pip
    - cython >=0.25.2
    - llvm-openmp  # [osx]
    - numpy
  run:
    - python
    - llvm-openmp  # [osx]
    - numpy >=1.8
    - pandas >=0.17
    - requests >=2.0
    - scikit-learn >=0.18
    - pytables >=3.1

test:
  source_files:
    - tests/
  files:
    - osm_sample.h5
  imports:
    - pandana
    - pandana.cyaccess
    - pandana.loaders
  commands:
    - pip check
    - mv osm_sample.h5 tests/ && pytest tests/  # [not win]
  requires:
    - pip
    - pytest

about:
  home: https://github.com/udst/pandana
  license: AGPL-3.0-only
  license_family: AGPL
  license_file: LICENSE.txt
  summary: Python library for network analysis
  description: |
    Pandana is a Python library for network analysis that uses contraction hierarchies to calculate super-fast travel accessibility metrics and shortest paths. The numerical code is in C++.
  doc_url: https://udst.github.io/pandana
  dev_url: https://github.com/udst/pandana

extra:
  recipe-maintainers:
    - waddell
    - smmaurer
    - sablanchard
    - ocefpaf
